# Rate limit for the ChessGuru board-scan endpoints.
#
# The scan API takes no auth and had no limit, so anyone could farm it: each
# call is ~2.6 core-seconds on the box that also serves live classes, and
# enough call/answer pairs are all you need to distil a copy of our extractor
# without ever touching the weights. (Which is precisely what our own notes
# forbid us doing to ChessVision AI.)
#
# chessguru.cc is behind Cloudflare, so $binary_remote_addr is the EDGE's
# address and limiting on it would throttle every visitor as one bucket.
# Prefer Cloudflare's client header and fall back to the socket address on
# domains served directly, like the coach domains.
map $http_cf_connecting_ip $cg_vision_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# 30/min sustained with a burst of 15: a coach working through a page of
# diagrams fires one call per board they pick, so the burst has to cover a
# full page. A script cannot get more than 30 a minute out of it.
limit_req_zone $cg_vision_client zone=cgvision:10m rate=30r/m;
limit_req_status 429;

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessGuru — Puzzle Trainer</title>
    <link rel="icon" id="cg-favicon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" id="cg-manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" id="cg-theme-color" content="#7c3aed" />
    <link rel="apple-touch-icon" id="cg-apple-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="cg-apple-title" content="ChessGuru" />
    <script>
      // Tenant-aware branding + PWA. On non-canonical hosts (gunachess.com)
      // OR when a signed-in academy member is on a canonical host (chessguru.cc):
      //  1. SYNCHRONOUSLY apply cached brand from localStorage (title, apple
      //     title, apple icon, theme color) so the browser tab never flashes
      //     "ChessGuru" on repeat visits.
      //  2. Swap <link rel="manifest"> to the tenant manifest endpoint so
      //     installed PWA icon + name match the academy.
      //  3. Background-refresh from /api/academy-page/by-domain OR /:slug so
      //     next load picks up profile edits.
      // 2026-08-27: session-fallback added so students on chessguru.cc apex
      // (not their subdomain) also see academy branding. Same pattern as the
      // Navbar's useTenantSlug session-fallback.
      (function () {
        try {
          var host = location.hostname.toLowerCase();
          var canonical = /(^|\.)(harinitharanjith\.com|chessguru\.(cc|com))$/.test(host) || host === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(host);
          var slugFromHost = canonical ? null : host.split(".")[0];
          try { window.__cgIsTenant = !canonical; } catch (e) { /* non-fatal */ }
          var manifestLink = document.getElementById("cg-manifest");

          var applyBrand = function (name, logo) {
            if (name) {
              document.title = name;
              var t = document.getElementById("cg-apple-title");
              if (t) t.setAttribute("content", name);
              // Owner 2026-09-22: the boot screen must say the ACADEMY's name, not
              // "ChessGuru". The splash is built by a separate IIFE below, which may
              // render before or after the brand resolves — so publish the name and
              // patch any splash that is already on screen.
              try {
                window.__cgBrandName = name;
                var lbl = document.querySelector("#cg-boot-status .waiting b");
                if (lbl) lbl.textContent = "Loading " + name + "\u2026";

              } catch (e) { /* non-fatal */ }
            }
            if (logo) {
              var i = document.getElementById("cg-apple-icon");
              if (i) i.setAttribute("href", logo);
              // Browser-tab favicon. Setting href alone works in Chrome/Edge/
              // Safari; also clear the type attr so the browser sniffs the
              // real MIME (svg default → webp tenant logo would mismatch).
              var fi = document.getElementById("cg-favicon");
              if (fi) { fi.setAttribute("href", logo); fi.removeAttribute("type"); }
            }
            var tc = document.getElementById("cg-theme-color");
            if (tc) tc.setAttribute("content", "#14a2b8");
          };

          var pointManifestToSlug = function (slug) {
            if (manifestLink && slug) manifestLink.setAttribute("href", "/v2api/api/academy-page/manifest?slug=" + encodeURIComponent(slug));
          };

          var applyCachedBrandForSlug = function (slug) {
            try {
              var raw = localStorage.getItem("cg.tenant-brand");
              if (!raw) return false;
              var cache = JSON.parse(raw);
              var hit = cache && cache[slug];
              if (hit && hit.name) { applyBrand(hit.name, hit.logoUrl); return true; }
            } catch (e) { /* ignore */ }
            return false;
          };

          var refreshBrandForSlug = function (slug) {
            fetch("/v2api/api/academy-page/" + encodeURIComponent(slug))
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                if (!j) return;
                var name = (j.profile && j.profile.displayName) || (j.academy && j.academy.name);
                var logo = (j.profile && j.profile.logoUrl) || null;
                if (name) applyBrand(name, logo);
                try {
                  var raw2 = localStorage.getItem("cg.tenant-brand");
                  var cache2 = raw2 ? JSON.parse(raw2) : {};
                  cache2[slug] = { name: name || "", logoUrl: logo };
                  localStorage.setItem("cg.tenant-brand", JSON.stringify(cache2));
                } catch (e) { /* ignore */ }
              })
              .catch(function () { /* non-fatal */ });
          };

          // (A) Non-canonical host path — swap immediately from hostname.
          if (slugFromHost) {
            pointManifestToSlug(slugFromHost);
            applyCachedBrandForSlug(slugFromHost);
            refreshBrandForSlug(slugFromHost);
            return;
          }

          // (B) Canonical host — try session-derived slug (chessguru.cc apex).
          //     Hydrate synchronously from cached session-academy so the first
          //     paint is already tenant-branded on repeat visits, then confirm
          //     from /auth/me on refresh.
          var cachedSessionSlug = null;
          try { cachedSessionSlug = localStorage.getItem("cg.session-academy"); } catch (e) { /* ignore */ }
          if (cachedSessionSlug) {
            pointManifestToSlug(cachedSessionSlug);
            applyCachedBrandForSlug(cachedSessionSlug);
          }
          fetch("/v2api/auth/me", { credentials: "include" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              var aid = j && j.academyId;
              if (!aid) {
                // logged out or non-academy user — leave defaults if not
                // already swapped, and wipe cache so a stale seed doesn't
                // haunt them.
                try { localStorage.removeItem("cg.session-academy"); } catch (e) { /* ignore */ }
                return;
              }
              try { localStorage.setItem("cg.session-academy", aid); } catch (e) { /* ignore */ }
              if (aid !== cachedSessionSlug) {
                pointManifestToSlug(aid);
                applyCachedBrandForSlug(aid);
              }
              refreshBrandForSlug(aid);
            })
            .catch(function () { /* non-fatal */ });
        } catch (e) { /* non-fatal */ }
      })();
    </script>
    <script>
      // Resolve theme BEFORE React renders so the page never flashes in the
      // wrong palette. Default (no saved choice) is LIGHT for every user.
      (function () {
        try {
          var saved = localStorage.getItem("cg.theme");
          var mode = saved === "dark" ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("light", mode === "light");
          root.classList.toggle("dark", mode === "dark");
        } catch (e) { /* fall through */ }
      })();
    </script>
    <style>
      /* Inline styles for the loading + failure fallback so they render even
         before the CSS bundle arrives (which is the whole point of the
         safety net — the app hasn't booted yet). */
      #cg-boot-status { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0f19; color: #f1f5f9; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align: center; padding: 24px; }
      #cg-boot-status.hidden { display: none; }
      #cg-boot-status .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #1f2937; border-top-color: #6366f1; animation: cg-spin 800ms linear infinite; margin-bottom: 18px; }
      #cg-boot-status .msg { font-size: 14px; color: #9ca3af; max-width: 320px; line-height: 1.5; }
      #cg-boot-status .msg b { color: #f1f5f9; }
      #cg-boot-status .actions { display: none; margin-top: 22px; gap: 8px; flex-wrap: wrap; justify-content: center; }
      #cg-boot-status .actions button { border: 1px solid #374151; background: #111827; color: #f1f5f9; font-size: 13px; font-weight: 600; padding: 10px 16px; border-radius: 10px; cursor: pointer; }
      #cg-boot-status .actions button.primary { background: linear-gradient(135deg, #4f46e5, #6366f1); border-color: transparent; }
      #cg-boot-status.stuck .spinner { animation: none; border-top-color: #f59e0b; }
      #cg-boot-status.stuck .actions { display: flex; }
      #cg-boot-status.stuck .msg .waiting { display: none; }
      @keyframes cg-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // ---- White-screen safety net (2026-08-15, tightened 2026-08-30) -----
      //
      // The v2 bundle is large (~5 MB uncompressed / ~1 MB gzip) and Indian
      // parents on 3G can easily need 10-12 s to download + parse it. The
      // ORIGINAL 6-second cutoff was firing routinely on slow connections,
      // even when the app WOULD have booted given another few seconds. First
      // fire → clear caches + reload; second fire → "failed twice" dead-end
      // screen telling the parent to close the tab. Guna hit this repeatedly
      // yesterday.
      //
      // Fix:
      //   * Timeout 6 s → 15 s (realistic for slow 3G given bundle size).
      //   * Show an inline spinner + progress copy the whole time so the
      //     parent sees "we're loading" instead of a white void.
      //   * At 15 s if root is still empty, show a "still loading, wait or
      //     hard-reset" screen with two buttons instead of dead-ending.
      //   * "Wait longer" clears the recovery flag + hides the fallback so
      //     the parent can wait another 30 s without losing progress.
      //   * "Hard reset" is the OLD nuke-caches-and-reload behaviour, gated
      //     behind an explicit tap so we never surprise-nuke a slow load.
      (function () {
        var TIMEOUT_MS = 15000;
        var status = null;
        // Set once React has actually painted. Everything below refuses to create or
        // re-show the overlay after this, because the module script that signals it
        // runs BEFORE DOMContentLoaded — without this flag the overlay was created
        // after the all-clear and nothing was left to remove it.
        var appBooted = false;
        // The academy's name if we know it (set by the branding IIFE above). On a
        // tenant domain we would rather say nothing than say "ChessGuru".
        function bootBrand() {
          try {
            var n = (window.__cgBrandName || "").trim();
            if (n) return n;
            if (window.__cgIsTenant) return "";
          } catch (e) { /* fall through */ }
          return "ChessGuru";
        }
        function bootTitle() {
          var n = bootBrand();
          return n ? "Loading " + n + "\u2026" : "Loading\u2026";
        }
        function ensureStatus() {
          if (appBooted) return null;
          if (status) return status;
          status = document.createElement("div");
          status.id = "cg-boot-status";
          status.innerHTML =
            '<div>' +
              '<div class="spinner"></div>' +
              '<div class="msg">' +
                '<div class="waiting"><b>' + bootTitle() + '</b><br>Hang on — first load can take a few seconds on slow connections.</div>' +
                '<div class="stuck-msg" style="display:none"><b>Still loading.</b><br>Your connection is slow — wait a bit longer, or hard-reset to clear caches and try again.</div>' +
                '<div class="cg-err" style="display:none;margin-top:8px;font:12px/1.4 ui-monospace,monospace;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:6px 8px;text-align:left;word-break:break-word;max-height:9em;overflow:auto"></div>' +
              '</div>' +
              '<div class="actions">' +
                '<button class="primary" id="cg-wait">Wait longer</button>' +
                '<button id="cg-reset">Hard reset</button>' +
              '</div>' +
            '</div>';
          (document.body || document.documentElement).appendChild(status);
          status.querySelector("#cg-wait").addEventListener("click", function () {
            try { sessionStorage.removeItem("cg_recovered"); } catch (e) {}
            status.classList.remove("stuck");
            status.querySelector(".stuck-msg").style.display = "none";
            status.querySelector(".waiting").style.display = "";
            // Give React another full window before showing stuck again.
            scheduleStuck(TIMEOUT_MS);
          });
          status.querySelector("#cg-reset").addEventListener("click", function () {
            (async function () {
              try {
                if ("serviceWorker" in navigator) {
                  var regs = await navigator.serviceWorker.getRegistrations();
                  for (var i = 0; i < regs.length; i++) await regs[i].unregister();
                }
                if ("caches" in window) {
                  var keys = await caches.keys();
                  for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
                }
                // Storage too. Clearing only the SW and caches left one real
                // failure unfixable from inside the app: 2026-09-09, a phone
                // showed this panel then a blank page on ONE origin while the
                // SAME build worked on another, with both domains serving
                // byte-identical JS. Nothing server-side could explain it, and
                // Hard reset could not clear what was actually stuck. The user
                // was left deleting website data in iOS Settings. Whatever a
                // bad persisted value is, it should not survive a reset the
                // user explicitly asked for. Sign-in lives in an httpOnly
                // cookie, so this costs preferences, not the session.
                try { localStorage.clear(); } catch (e) {}
                try { sessionStorage.clear(); } catch (e) {}
                try {
                  if (window.indexedDB && indexedDB.databases) {
                    var dbs = await indexedDB.databases();
                    for (var k = 0; k < dbs.length; k++) {
                      if (dbs[k] && dbs[k].name) indexedDB.deleteDatabase(dbs[k].name);
                    }
                  }
                } catch (e) {}
              } catch (e) {}
              location.reload();
            })();
          });
          return status;
        }
        function hideStatus() { if (status) status.classList.add("hidden"); }
        // THE definitive off-switch (owner TKT-255/257, 2026-09-22). The poller below
        // is the only thing that removed this overlay, and it gives up after 60 s — so
        // when the box ran out of memory and the app took longer than that to mount,
        // the overlay stayed frozen ON TOP of a fully-loaded puzzle board. React now
        // calls this the moment it commits, whatever the boot took.
        window.__cgBootDone = function () {
          appBooted = true;
          hideStatus();
          try {
            if (checkInterval) clearInterval(checkInterval);
            if (stuckTimer) { clearTimeout(stuckTimer); stuckTimer = null; }
            if (status && status.parentNode) status.parentNode.removeChild(status);
          } catch (e) { /* non-fatal */ }
        };
        // Capture whatever actually went wrong. A blank page tells the user
        // nothing and tells us less: on 2026-09-09 a coach hit a white screen
        // on one domain while the SAME build worked on another, and with no
        // console on iPhone there was no way to tell a slow download from a
        // thrown exception. Both look identical from outside. Show it instead.
        var cgLastError = "";
        function noteError(what) {
          if (!cgLastError) cgLastError = String(what || "").slice(0, 400);
          var s = status;
          if (s && s.classList.contains("stuck")) showError();
        }
        function showError() {
          if (!status || !cgLastError) return;
          var box = status.querySelector(".cg-err");
          if (!box) return;
          box.textContent = cgLastError;
          box.style.display = "";
        }
        window.addEventListener("error", function (e) {
          noteError((e && e.message ? e.message : "script error") +
                    (e && e.filename ? " @ " + String(e.filename).split("/").pop() : "") +
                    (e && e.lineno ? ":" + e.lineno : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          noteError("unhandled: " + (r && r.message ? r.message : String(r)));
        });

        function markStuck() {
          if (appBooted) return;
          var s = ensureStatus();
          if (!s) return;
          s.classList.add("stuck");
          s.querySelector(".waiting").style.display = "none";
          s.querySelector(".stuck-msg").style.display = "";
          showError();
        }
        var stuckTimer = null;
        var checkInterval = null;
        function scheduleStuck(ms) {
          if (stuckTimer) clearTimeout(stuckTimer);
          stuckTimer = setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) { hideStatus(); return; }
            markStuck();
          }, ms);
        }
        // Show the spinner immediately, then either React takes over or we
        // switch to the stuck state at TIMEOUT_MS.
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { ensureStatus(); }, { once: true });
        } else {
          ensureStatus();
        }
        scheduleStuck(TIMEOUT_MS);
        // Once React renders, hide the fallback.
        checkInterval = setInterval(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) {
            hideStatus();
            try { sessionStorage.removeItem("cg_recovered"); } catch (e) {}
            clearInterval(checkInterval);
            if (stuckTimer) { clearTimeout(stuckTimer); stuckTimer = null; }
          }
        }, 250);
        // Do NOT give up at 60 s. On 2026-09-22 the box ran out of RAM, boot took
        // longer than a minute, the poller had already stopped and the overlay stayed
        // frozen on top of a working app (owner TKT-255/257). The check is one
        // childElementCount read every 250 ms; ten minutes of that is free, and
        // __cgBootDone clears it the moment React commits anyway.
        setTimeout(function () { if (checkInterval) clearInterval(checkInterval); }, 600000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Support widget: the SHARED bundle from packages/support-widget, proxied
         by our own API so a fix there reaches us with no rebuild. It used to be
         forked into src/components/SupportWidget.tsx, which is how the POS one
         grew to 50 attachments while this stayed at 4.
         data-api-base keeps its calls on /v2api/api/support, so our controller
         still stamps the academy onto the ticket before forwarding. -->
    <script src="/v2api/api/support/widget" defer data-app="chessguru" data-api-base="/v2api/api/support"></script>
  </body>
</html>

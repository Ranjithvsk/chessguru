<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessGuru — Puzzle Trainer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChessGuru" />
    <script>
      // Resolve theme BEFORE React renders so the page never flashes in the
      // wrong palette. localStorage("cg.theme") wins over OS preference; when
      // set to "system" (or unset) we follow prefers-color-scheme.
      (function () {
        try {
          var saved = localStorage.getItem("cg.theme");
          var mode = saved === "light" || saved === "dark" ? saved
            : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          var root = document.documentElement;
          root.classList.toggle("light", mode === "light");
          root.classList.toggle("dark", mode !== "light");
        } catch (e) { /* fall through with default dark from HTML */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChessGuru — Puzzle Trainer</title>
    <link rel="icon" id="cg-favicon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" id="cg-manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" id="cg-theme-color" content="#7c3aed" />
    <link rel="apple-touch-icon" id="cg-apple-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="cg-apple-title" content="ChessGuru" />
    <script>
      // Tenant-aware branding + PWA. On non-canonical hosts (gunachess.com etc):
      //  1. SYNCHRONOUSLY apply cached brand from localStorage (title, apple
      //     title, apple icon, theme color) so the browser tab never flashes
      //     "ChessGuru" on repeat visits.
      //  2. Swap <link rel="manifest"> to the tenant manifest endpoint.
      //  3. Background-refresh the cache from /api/academy-page/by-domain so
      //     next load picks up any tenant profile edits.
      // Shares BRAND_CACHE_KEY with Navbar.useTenantBrand so the whole app
      // agrees on the same tenant identity from one localStorage entry.
      (function () {
        try {
          var host = location.hostname.toLowerCase();
          var canonical = /(^|\.)harinitharanjith\.com$/.test(host) || host === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(host);
          if (canonical) return;
          var slug = host.split(".")[0];
          var manifestLink = document.getElementById("cg-manifest");
          if (manifestLink) manifestLink.setAttribute("href", "/v2api/api/academy-page/manifest?host=" + encodeURIComponent(host));
          var applyBrand = function (name, logo) {
            if (name) {
              document.title = name;
              var t = document.getElementById("cg-apple-title");
              if (t) t.setAttribute("content", name);
            }
            if (logo) {
              var i = document.getElementById("cg-apple-icon");
              if (i) i.setAttribute("href", logo);
              // Browser-tab favicon. Setting href alone works in Chrome/Edge/
              // Safari; also clear the type attr so the browser sniffs the
              // real MIME (svg default → webp tenant logo would mismatch).
              var fi = document.getElementById("cg-favicon");
              if (fi) { fi.setAttribute("href", logo); fi.removeAttribute("type"); }
            }
            var tc = document.getElementById("cg-theme-color");
            if (tc) tc.setAttribute("content", "#14a2b8");
          };
          // (1) Synchronous cache hit
          try {
            var raw = localStorage.getItem("cg.tenant-brand");
            if (raw) {
              var cache = JSON.parse(raw);
              var hit = cache && cache[slug];
              if (hit && hit.name) applyBrand(hit.name, hit.logoUrl);
            }
          } catch (e) { /* ignore */ }
          // (3) Background refresh
          fetch("/v2api/api/academy-page/by-domain/" + encodeURIComponent(host))
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              if (!j) return;
              var name = (j.profile && j.profile.displayName) || (j.academy && j.academy.name);
              var logo = (j.profile && j.profile.logoUrl) || null;
              if (name) applyBrand(name, logo);
              try {
                var raw2 = localStorage.getItem("cg.tenant-brand");
                var cache2 = raw2 ? JSON.parse(raw2) : {};
                cache2[slug] = { name: name || "", logoUrl: logo };
                localStorage.setItem("cg.tenant-brand", JSON.stringify(cache2));
              } catch (e) { /* ignore */ }
            })
            .catch(function () { /* non-fatal */ });
        } catch (e) { /* non-fatal */ }
      })();
    </script>
    <script>
      // Resolve theme BEFORE React renders so the page never flashes in the
      // wrong palette. Default (no saved choice) is LIGHT for every user.
      (function () {
        try {
          var saved = localStorage.getItem("cg.theme");
          var mode = saved === "dark" ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("light", mode === "light");
          root.classList.toggle("dark", mode === "dark");
        } catch (e) { /* fall through */ }
      })();
    </script>
    <script>
      // WHITE-SCREEN SAFETY NET (2026-08-15). If React hasn't rendered
      // anything into #root within 6 seconds, force-recover: unregister ALL
      // service workers + clear caches + reload. This escapes stuck SW
      // states where a cached bundle references an asset that no longer
      // exists on the server (which broke every device during Aug 15's
      // rapid-deploy cycle).
      (function () {
        setTimeout(function () {
          try {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) return;
            if (sessionStorage.getItem("cg_recovered") === "1") {
              document.body.innerHTML = "<div style='padding:20px;font-family:sans-serif'><h2>ChessGuru failed to load twice.</h2><p>Please close and reopen the browser tab, or try a different browser.</p></div>";
              return;
            }
            sessionStorage.setItem("cg_recovered", "1");
            (async function () {
              try {
                if ("serviceWorker" in navigator) {
                  var regs = await navigator.serviceWorker.getRegistrations();
                  for (var i = 0; i < regs.length; i++) await regs[i].unregister();
                }
                if ("caches" in window) {
                  var keys = await caches.keys();
                  for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
                }
              } catch (e) { /* recover anyway */ }
              location.reload();
            })();
          } catch (e) { /* nothing else to do */ }
        }, 6000);
        window.addEventListener("load", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0) sessionStorage.removeItem("cg_recovered");
          }, 2000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
